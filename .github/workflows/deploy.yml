name: Production CI/CD & Docker Pipeline

on:
  push:
    branches:
      - main

# Zero-AWS Compliance: Strictly no AWS dependencies.
# Uses Render for Docker runtime, Cloudflare for CDN/R2, and Supabase for PostgreSQL.

jobs:
  validate-and-build:
    name: Lint, Typecheck, Test & Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Multi-Tenant RLS Test Suite
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://demo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'demo-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'demo-service-key' }}

      - name: Verify Docker Container Build
        run: docker build -t tasq-one:latest .

      - name: Trigger Render Deploy Hook (Optional)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render automatic deployment..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
